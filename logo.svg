<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Raven Flock">
  <title>Raven Flock</title>
  <!-- three ravens in soft flock -->
  <g fill="#1C1917">
    <!-- left raven -->
    <g transform="translate(58,42) scale(0.72)">
      <ellipse cx="0" cy="6" rx="18" ry="11"/>
      <circle cx="16" cy="-6" r="9"/>
      <path d="M24 -7 L36 -2 L25 1 Z"/>
      <path d="M-8 0 C-22 -14,-28 6,-10 14 C0 18,12 10,16 4 C6 8,-2 6,-8 0 Z" fill="#2A2622"/>
      <path d="M-14 8 L-28 16 L-22 6 L-16 2 Z"/>
      <circle cx="18" cy="-8" r="1.6" fill="#F5F0E6"/>
      <path d="M32 -3 L36 -2 L33 -1 Z" fill="#D4A574"/>
    </g>
    <!-- center raven (larger) -->
    <g transform="translate(110,36)">
      <ellipse cx="0" cy="8" rx="24" ry="14"/>
      <circle cx="22" cy="-8" r="12"/>
      <path d="M32 -10 L48 -2 L34 2 Z"/>
      <path d="M-12 0 C-32 -18,-40 8,-14 18 C0 24,16 12,22 4 C8 10,-2 8,-12 0 Z" fill="#2A2622"/>
      <path d="M-18 10 L-38 22 L-30 6 L-20 2 Z"/>
      <circle cx="25" cy="-11" r="2.2" fill="#F5F0E6"/>
      <path d="M42 -4 L48 -2 L43 0 Z" fill="#D4A574"/>
      <!-- soft wing gold accent -->
      <path d="M-22 4 C-30 -2,-24 -12,-12 -4" fill="none" stroke="#D4A574" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    </g>
    <!-- right raven -->
    <g transform="translate(168,44) scale(0.68)">
      <ellipse cx="0" cy="6" rx="18" ry="11"/>
      <circle cx="16" cy="-6" r="9"/>
      <path d="M24 -7 L36 -2 L25 1 Z"/>
      <path d="M-8 0 C-22 -14,-28 6,-10 14 C0 18,12 10,16 4 C6 8,-2 6,-8 0 Z" fill="#2A2622"/>
      <path d="M-14 8 L-28 16 L-22 6 L-16 2 Z"/>
      <circle cx="18" cy="-8" r="1.6" fill="#F5F0E6"/>
      <path d="M32 -3 L36 -2 L33 -1 Z" fill="#D4A574"/>
    </g>
  </g>
  <!-- soft dawn arc -->
  <path d="M40 58 C80 28, 180 28, 220 58" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <!-- wordmark -->
  <text x="130" y="98" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="600" fill="#1C1917"
        letter-spacing="3.5">RAVEN FLOCK</text>
</svg>
